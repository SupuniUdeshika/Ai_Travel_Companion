name: ai_travel_companion
description: "AI Travel Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  lottie: ^2.7.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.3
  cloud_firestore: ^4.13.3
  google_sign_in: ^6.1.5

  # State Management
  provider: ^6.1.1
  
  # Location
  geocoding: ^2.1.1
  geolocator: ^12.0.0
  
  # HTTP & Storage
  http: ^1.1.0
  image_picker: ^1.1.1
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  intl: ^0.19.0

  # ML model
  onnxruntime: ^1.4.1
  
 # Notification
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - .env
    - assets/models/weather_model.onnx
    - assets/models/model_metadata.json